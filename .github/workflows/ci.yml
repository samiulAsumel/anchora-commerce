name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://anchora:anchora@localhost:5432/anchora?schema=public
  JWT_SECRET: ci-placeholder-secret-at-least-32-characters
  JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-at-least-32-chars

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchora
          POSTGRES_PASSWORD: anchora
          POSTGRES_DB: anchora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anchora -d anchora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db seed
      - run: npm run build
      - name: Start app and wait for health check
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 1
          done
      - run: npm run test:e2e

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: anchora-commerce:ci
